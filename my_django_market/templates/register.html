{% extends "base.html" %}

{% block title %}Register{% endblock title %}

{% block main %}
    <main class="register_main">
        <h1 class="register_title">Create your account here!</h1>
        <form class="register_form" method="post">
            {% csrf_token %}
            {{ form }}
            <input type="submit" value="register">
            <br>
            <span class="register_info">Already have an account? --> <a href='{% url "login" %}'>Login</a></span>
        </form>
    </main>
{% endblock main %}
